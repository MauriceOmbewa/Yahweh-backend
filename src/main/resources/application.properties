server.port=${PORT:8080}

# API.Bible configuration
api.bible.base-url=https://rest.api.bible/v1
api.bible.key=${API_BIBLE_KEY}

# PostgreSQL database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yahweh_dev}
spring.datasource.username=${DB_USERNAME:apple}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway database migrations
spring.flyway.enabled=true

# JWT configuration
# jwt.secret must be a Base64-encoded secret of at least 64 bytes (512 bits) for HS512.
# Generate with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-seconds=${JWT_ACCESS_EXPIRY_SECONDS:900}
jwt.refresh-token-expiry-seconds=${JWT_REFRESH_EXPIRY_SECONDS:2592000}

# Google Sign-In
# The OAuth 2.0 client ID from Google Cloud Console.
google.client-id=${GOOGLE_CLIENT_ID:}

# CORS — comma-separated list of allowed origins (no trailing slash)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Password reset token expiry (seconds); default 1 hour
auth.password-reset-expiry-seconds=${PASSWORD_RESET_EXPIRY_SECONDS:3600}
